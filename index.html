<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <!-- Menu Section -->
    <section id="menu-section">
        <header>
            <div class="menu-header">
                <img src="header.png" alt="Menu Header">
                <div class="languageWrap">
                    <div class="button-wrapper"><button id="language-en" class="language-toggle active">EN</button></div>
                    <div class="button-wrapper"><button id="language-zh" class="language-toggle">中</button></div>
                </div>
            </div>
        </header>

        <main>
            <section id="menu">
                <div id="menu-items"></div>
            </section>
        </main>

        <!-- Floating Buttons -->
        <div class="operation">
            <hr>
            <div id="floating-buttons">
                <div class="button-wrapper2"><button id="scroll-up">^</button></div>
                <div class="button-wrapper2"><button id="scroll-down">^</button></div>
                <button id="view-cart">View Menu <span id="cart-count">0</span></button>
            </div>
        </div>
    </section>

    <!-- Order Summary Section (隐藏，点击 "View Menu" 后显示) -->
    <section id="order-summary" style="display: none;">
        <header>
            <div class="menu-header">
                <div class="button-wrapper"><button id="back-to-menu">^</button></div>
                <img src="header.png" alt="Menu Header">
                <div class="languageWrap">
                    <div class="button-wrapper"><button id="language-en" class="language-toggle active">EN</button></div>
                    <div class="button-wrapper"><button id="language-zh" class="language-toggle">中</button></div>
                </div>
            </div>
        </header>

        <main>
            <h2 class="menu-category">Your Info</h2>
            <p>Dear Valia, with trembling hands, I humbly ask for your culinary grace on 
                <input type="text" id="date-input" class="user-input" placeholder="[Date]">.
                As your faithful admirer, I long to dine at 
                <input type="text" id="time-input" class="user-input" placeholder="[Time]"> with you.
                Please allow me to add:
                <input type="text" id="note-input" class="user-input" placeholder="[Your Addition (Love) Note]">
            </p>
            <p>Your artistry turns mere food into magic, and I await your reply with bated breath.</p>
            <p style="width :100%;">Yours most humbly,<br> <input type="text" id="name-input" class="user-input" placeholder="[Name]"></p>

            <h2 class="menu-category">Menu</h2>
            <div id="selected-menu-items"></div>
        </main>

        <!-- Floating Buttons -->
        <div class="operation">
            <hr>
            <div id="floating-buttons">
                <div class="button-wrapper2"><button id="back-to-menu2">^</button></div>
                <button id="all-set">All Set<span id="cart-count">0</span></button>
            </div>
        </div>
    </section>
</body>
</html>
